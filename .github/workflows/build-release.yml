name: Build and publish EMF compatibility bridge

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "patch/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build bridge
        run: python3 tools/build_bridge.py

      - name: Verify archive
        run: |
          python3 - <<'PY'
          import zipfile
          p = 'dist/entity_model_features-3.3.5-1.21-neoforge.jar'
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
          print('JAR integrity OK')
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: emf-3.3.5-legacy-compat-bridge
          path: dist/entity_model_features-3.3.5-1.21-neoforge.jar

      - name: Download upstream EMF license
        run: curl -fL https://raw.githubusercontent.com/Traben-0/Entity_Model_Features/master/LICENSE -o LICENSE-EMF.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="emf-3.3.5-legacy-compat-bridge"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "EMF 3.3.5 Legacy Compatibility Bridge" \
              --notes "Patched EMF 3.3.5 for Minecraft 1.21.1 / NeoForge 21.1.248. Restores the legacy EMFAnimationEntityContext API used by older EMF Compat modules and bridges Better Combat pause behavior to current EMF APIs."
          fi
          gh release upload "$TAG" dist/entity_model_features-3.3.5-1.21-neoforge.jar LICENSE-EMF.txt --clobber
